# Diagnostic build — prints state before npm run build so we can see what
# Netlify's cache restore is putting in the source tree. Remove the echo block
# once the deploy is succeeding.
[build]
  command = """
    echo '=== PRE-BUILD STATE ===' &&
    pwd &&
    echo '--- root ---' && ls -la &&
    echo '--- lib/ ---' && ls -la lib/ 2>&1 &&
    echo '--- .next exists? ---' && ls -la .next 2>&1 | head -10 &&
    echo '--- find supabase ---' && find . -name 'supabase*' -not -path './node_modules/*' 2>&1 &&
    echo '--- grep supabase-js refs ---' && grep -rln '@supabase/supabase-js' . --include='*.ts' --include='*.tsx' --include='*.json' --exclude-dir=node_modules --exclude-dir=.next 2>&1 &&
    echo '=== CLEANING ===' && rm -rf .next node_modules/.cache &&
    echo '=== BUILDING ===' &&
    npm run build
  """
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"
