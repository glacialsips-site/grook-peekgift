# Deploy the vNext studio: apps/web, a Next app inside the pnpm/Turborepo workspace.
# To go live: point the Netlify site's PRODUCTION BRANCH at this branch
# (claude/gallant-planck-pu51x). Every push then builds + deploys to vnext.peek.gift.
# The site's existing env vars (ANTHROPIC_API_KEY, SUPABASE_*, STRIPE_*, NEXT_PUBLIC_*)
# light up the curator turn, persistence, and publish live. See _packets/SPINE/DEPLOY.md.

[build]
  base = "apps/web"
  # base is apps/web, so cd up to install the whole pnpm workspace, then build just web.
  command = "cd .. && corepack enable && pnpm install --frozen-lockfile && pnpm --filter @peek/web build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

[[plugins]]
  package = "@netlify/plugin-nextjs"
