# Netlify persists /opt/build/repo across deploys. New uploads OVERLAY on the
# previous tree instead of replacing it, so files I've deleted between deploys
# (lib/supabase.ts, .env.local, etc.) keep haunting the build.
#
# We explicitly evict known-stale artifacts from prior deploys before running
# next build. Add to this list if a deploy log ever again shows files dated
# from a previous deploy that aren't in your current source.
[build]
  command = """
    set -e
    echo '=== EVICTING STALE FILES FROM PRIOR DEPLOYS ==='
    rm -rf lib/supabase.ts .env.local .env tsconfig.tsbuildinfo deno.lock .next .netlify/functions-internal .netlify/.next .netlify/blobs-internal node_modules/.cache .turbo
    echo '=== STATE AFTER PURGE ==='
    ls lib/ | head -20
    echo '--- find supabase remnant ---'
    find . -name 'supabase.ts' -not -path './node_modules/*' 2>&1
    echo '=== BUILD ==='
    npm run build
  """
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"
