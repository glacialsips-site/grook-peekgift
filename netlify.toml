# vnext deploy config for the clean-room peek.gift engine (workspace/peek).
#
# On this branch (claude/jolly-mccarthy-QMqC9), Netlify builds the @peek/web app
# via `base`, so the branch deploy serves the new vibe-genome engine + live
# synthesis. The production branch keeps its own root-app netlify.toml until this
# is deliberately promoted to primary.
[build]
  base = "workspace/peek"
  command = "pnpm --filter @peek/web build"
  publish = "apps/web/.next"

[build.environment]
  NODE_VERSION = "22"
  PNPM_FLAGS = "--shamefully-hoist=false"

[[plugins]]
  package = "@netlify/plugin-nextjs"
