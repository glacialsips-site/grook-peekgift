<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Mobile Chat Templates · Claude</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&display=swap" rel="stylesheet"/>
  <style>
    html, body { margin: 0; padding: 0; background: #EFEAE0; font-family: -apple-system, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    button { font: inherit; }
  </style>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="ios-frame.jsx"></script>
  <script type="text/babel" src="chat-shared.jsx"></script>
  <script type="text/babel" src="chat-templates.jsx"></script>

  <script type="text/babel">
    function ArtboardScreen({ children }) {
      // device frame at 1.0
      return (
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 20 }}>
          <IOSDevice>{children}</IOSDevice>
        </div>
      );
    }

    const items = [
      { id: 'a', label: 'A · Classic',        sub: 'Mic in composer, email in ⋯',  Comp: TemplateA },
      { id: 'b', label: 'B · Tool row',       sub: 'Email + mic visible peers',     Comp: TemplateB },
      { id: 'c', label: 'C · Inline chips',   sub: 'Email as message action, mic FAB', Comp: TemplateC },
      { id: 'd', label: 'D · Voice-first',    sub: 'Hero mic, email orbits',         Comp: TemplateD },
      { id: 'e', label: 'E · Action rail',    sub: 'Two-row composer, recording state', Comp: TemplateE },
    ];

    function App() {
      return (
        <DesignCanvas>
          <DCSection
            id="mobile-chat"
            title="Mobile Claude chat — email + microphone"
            subtitle="Five placements to compare. Drag to reorder, double-click a label to rename, click the ⤢ button to open one fullscreen.">
            {items.map(({ id, label, sub, Comp }) => (
              <DCArtboard key={id} id={id} label={label} sublabel={sub} width={442} height={914}>
                <ArtboardScreen><Comp/></ArtboardScreen>
              </DCArtboard>
            ))}
          </DCSection>
        </DesignCanvas>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
