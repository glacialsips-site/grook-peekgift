<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>peek.gift — fresh mockups</title>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<style>
  *{box-sizing:border-box} html,body{margin:0;height:100%}
  body{background:#13110c;color:#EDE7D8;font-family:"Hanken Grotesk",system-ui,sans-serif;overflow:hidden}
  .top{padding:18px 26px;border-bottom:1px solid #2a261c;display:flex;align-items:baseline;gap:14px}
  .top h1{margin:0;font-size:18px;font-weight:800;letter-spacing:-.01em}
  .top h1 b{color:#D97757}
  .top p{margin:0;font-size:12.5px;color:#9a9078}
  .rail{display:flex;gap:30px;padding:30px;overflow-x:auto;height:calc(100vh - 60px);align-items:flex-start;scroll-snap-type:x mandatory}
  .col{flex:0 0 auto;scroll-snap-align:center;display:flex;flex-direction:column;gap:12px}
  .cap{display:flex;flex-direction:column;gap:6px;padding:0 4px;max-width:390px}
  .cap .t{font-size:14px;font-weight:700}
  .cap .d{font-size:12px;color:#9a9078;line-height:1.4}
  .cap .tag{align-self:flex-start;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#D97757;border:1px solid #4a3a2c;border-radius:99px;padding:3px 9px;white-space:nowrap}
  .device{width:390px;height:780px;border-radius:42px;background:#000;padding:9px;box-shadow:0 30px 70px rgba(0,0,0,.5),0 0 0 1px #2a2620}
  .screen{width:100%;height:100%;border-radius:34px;overflow:hidden;background:#fff;position:relative}
  iframe{width:100%;height:100%;border:0;display:block}
  .hint{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);font-size:11px;color:#6f6757;background:#1c190f;border:1px solid #2a261c;padding:6px 14px;border-radius:99px}
</style>
</head>
<body>
  <div class="top">
    <h1>peek<b>.</b>gift — fresh mockups</h1>
    <p>five bespoke pages · same brain (FIRST_TRY), wildly different worlds · scroll each phone</p>
  </div>
  <div class="rail" id="rail"></div>
  <div class="hint">← scroll sideways for all five · each phone scrolls vertically →</div>
<script>
  const items = [
    {f:'The Send-Off.html', t:'The Send-Off', d:'Grandma → college nephew care package. Varsity "starting lineup," pennant, the soup is the star player.', tag:'Gift bundle'},
    {f:'For the Old Man.html', t:'For the Old Man', d:'Dad\'s 60th. A hardware-store work order — gruff outside, soft middle. The dinner is the ticket stub.', tag:'Gift bundle'},
    {f:'Soft Landing.html', t:'Soft Landing', d:'Meal train for new parents. Dawn palette, hushed serif, the calendar IS the gift.', tag:'Gift bundle'},
    {f:'Decree Absolute.html', t:'Decree Absolute', d:'A divorce party as a deadpan legal decree. The whole page is the document; the stamp is the bold move.', tag:'Invite'},
    {f:'El Taquito.html', t:'El Taquito', d:'Backyard taco night as a lotería card. Papel picado, bring-a-dish chips, ¡grita presente!', tag:'Invite'}
  ];
  const rail = document.getElementById('rail');
  items.forEach(it=>{
    const col=document.createElement('div'); col.className='col';
    col.innerHTML = `<div class="cap"><span class="tag">${it.tag}</span><span class="t">${it.t}</span><span class="d">${it.d}</span></div>
      <div class="device"><div class="screen"><iframe loading="lazy" src="${encodeURI(it.f)}"></iframe></div></div>`;
    rail.appendChild(col);
  });
</script>
</body>
</html>
