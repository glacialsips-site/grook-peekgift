<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Mobile Chat · Live preview · Claude</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&display=swap" rel="stylesheet"/>
  <style>
    html, body { margin: 0; padding: 0; background: #1A1518; font-family: -apple-system, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    button { font: inherit; border: none; }
    @keyframes rcardIn {
      0%   { box-shadow: 0 0 0 3px rgba(122,139,111,0.4), 0 6px 18px rgba(122,139,111,0.18); }
      100% { box-shadow: 0 0 0 6px rgba(122,139,111,0.1),  0 6px 18px rgba(122,139,111,0.18); }
    }
  </style>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="ios-frame.jsx"></script>
  <script type="text/babel" src="chat-shared.jsx"></script>
  <script type="text/babel" src="product-preview.jsx"></script>
  <script type="text/babel" src="chat-keyboard.jsx"></script>
  <script type="text/babel" src="chat-live.jsx"></script>
  <script type="text/babel" src="chat-live-docked.jsx"></script>

  <script type="text/babel">
    function Stage({ children }) {
      return (
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 20 }}>
          <IOSDevice backdrop={<ProductPreview/>}>{children}</IOSDevice>
        </div>
      );
    }

    function App() {
      return (
        <DesignCanvas>
          <DCSection
            id="live"
            title="Chat over a live preview"
            subtitle="The thing Claude is building shows through. Each message gets a feathered ink-wash for legibility — no hard bubbles, no clipped rectangles.">
            <DCArtboard id="up" label="K · Keyboard up" sublabel="Tools baked into the accessory bar — messages float in ink washes" width={442} height={914}>
              <Stage><LiveChat/></Stage>
            </DCArtboard>
            <DCArtboard id="down" label="L · Keyboard dismissed" sublabel="Chat collapses to a dock pill — product page is fully revealed" width={442} height={914}>
              <Stage><LiveChatDocked/></Stage>
            </DCArtboard>
          </DCSection>
        </DesignCanvas>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
